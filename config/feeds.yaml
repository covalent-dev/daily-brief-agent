feeds:
  # AI/Tech News (Daily)
  - name: "Hacker News"
    url: "https://hnrss.org/newest?q=AI+OR+GPT+OR+LLM"
    category: "Tech"

  - name: "OpenAI Blog"
    url: "https://openai.com/blog/rss.xml"
    category: "Tech"

  - name: "Microsoft AI Blog"
    url: "https://blogs.microsoft.com/ai/feed/"
    category: "Tech"

  - name: "TechCrunch AI"
    url: "https://techcrunch.com/tag/artificial-intelligence/feed/"
    category: "Tech"

  - name: "The Verge AI"
    url: "https://www.theverge.com/rss/ai-artificial-intelligence/index.xml"
    category: "Tech"

  # Tech job market / industry signal (Daily)
  - name: "Hacker News Jobs"
    url: "https://hnrss.org/newest?q=hiring+OR+layoffs+OR+jobs+OR+recruiting+OR+engineer"
    category: "Tech Jobs"

  - name: "TechCrunch Startups"
    url: "https://techcrunch.com/category/startups/feed/"
    category: "Tech"

  - name: "The Pragmatic Engineer"
    url: "https://blog.pragmaticengineer.com/rss/"
    category: "Tech Jobs"

  # AI Tools & Products (Sunday only)
  - name: "Product Hunt AI"
    url: "https://www.producthunt.com/feed?category=artificial-intelligence"
    category: "AI Tools"
    days: ["sunday"]

  - name: "GitHub Blog AI"
    url: "https://github.blog/tag/ai/feed/"
    category: "Developer Tools"
    days: ["sunday"]

settings:
  max_articles_per_feed: 5
  max_articles_to_summarize: 20
  filter_hours: 48
  summary_model: "deepseek-coder-v2:16b"

  vault_sync:
    enabled: true
    vault_path: "/Users/taxman/Taxman_Progression_v4/05_Knowledge_Base/Daily-Briefs"
