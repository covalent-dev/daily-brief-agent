app = "daily-brief-agent"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  DAILYBRIEF_CONFIG_PATH = "/app/config/feeds.yaml"
  DAILYBRIEF_OUTPUT_DIR = "/data/output"
  DAILYBRIEF_TZ = "America/Chicago"
  DAILYBRIEF_RUN_HHMM = "07:00"
  DAILYBRIEF_SCHEDULE_ENABLED = "true"
  DAILYBRIEF_DISABLE_VAULT_SYNC = "true"
  DAILYBRIEF_LLM_PROVIDER = "groq"
  GROQ_MODEL = "llama-3.1-8b-instant"

[[mounts]]
  source = "dailybrief_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "2s"
